version: "2"

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet checks
    - staticcheck    # static analysis (supersedes gosimple, stylecheck, etc.)
    - unused         # unused code
    - gosec          # security issues (OWASP-aligned)
    - misspell       # common spelling mistakes
    - godot          # comment punctuation
    - dupl           # duplicated code blocks
    - noctx          # http.Request without context
    - bodyclose      # http response body not closed

linters-settings:
  dupl:
    threshold: 100
  godot:
    scope: declarations
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files: relax some rules
    - path: "_test\\.go"
      linters:
        - dupl
        - gosec
