name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests + Concurrency Race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Run unit tests
        run: make test

      - name: Run concurrency tests with race detector
        env:
          RACE_COUNT: "2"
          IDX_CONCURRENCY_TIMEOUT_SECONDS: "45"
        run: make test-concurrency-race
