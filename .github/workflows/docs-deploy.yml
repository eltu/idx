name: Docs Deploy

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"

permissions: {}

jobs:
  trigger-site:
    name: Trigger idx-site redeploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger idx-site deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.IDX_SITE_TOKEN }}
          repository: eltu/idx-site
          event-type: docs-updated
