name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run test suite
        run: make test

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build artifact
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          base_name="idx-${TAG}-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            binary_name="${base_name}.exe"
            archive_name="${base_name}.zip"
            go build -trimpath -ldflags "-s -w" -o "dist/${binary_name}" ./cmd/idx
            cd dist
            zip -q "${archive_name}" "${binary_name}"
          else
            binary_name="${base_name}"
            archive_name="${base_name}.tar.gz"
            go build -trimpath -ldflags "-s -w" -o "dist/${binary_name}" ./cmd/idx
            tar -C dist -czf "dist/${archive_name}" "${binary_name}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/*
